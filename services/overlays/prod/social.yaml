apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: social
    app.kubernetes.io/instance: social
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social
      app.kubernetes.io/instance: social
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social
        app.kubernetes.io/instance: social
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: belovr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: social
          image: ghcr.io/nicolasdemol/social:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4300
              protocol: TCP
