apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/instance: chat
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
      app.kubernetes.io/instance: chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat
        app.kubernetes.io/instance: chat
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: belovr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: chat
          image: ghcr.io/nicolasdemol/chat:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: belovr-common-config
            - configMapRef:
                name: chat-config
            - secretRef:
                name: belovr-auth-secrets
            - secretRef:
                name: belovr-rabbitmq-secrets
            - secretRef:
                name: chat-db-secrets
            - secretRef:
                name: payment-shared-secrets
          ports:
            - name: http
              containerPort: 4200
              protocol: TCP
