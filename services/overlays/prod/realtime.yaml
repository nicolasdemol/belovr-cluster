apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/instance: realtime
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime
      app.kubernetes.io/instance: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime
        app.kubernetes.io/instance: realtime
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: belovr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: realtime
          image: ghcr.io/nicolasdemol/realtime:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4500
              protocol: TCP
