apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/instance: realtime
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
    belovr.io/environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime
      app.kubernetes.io/instance: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime
        app.kubernetes.io/instance: realtime
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: belovr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: realtime
          image: ghcr.io/nicolasdemol/realtime:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: belovr-common-config
            - configMapRef:
                name: realtime-config
            - secretRef:
                name: belovr-auth-secrets
            - secretRef:
                name: belovr-rabbitmq-secrets
          ports:
            - name: http
              containerPort: 4500
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/instance: realtime
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
    belovr.io/environment: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/instance: realtime
  ports:
    - name: http
      port: 4500
      targetPort: http
      protocol: TCP
