apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/instance: user
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user
      app.kubernetes.io/instance: user
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user
        app.kubernetes.io/instance: user
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: belovr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: user
          image: ghcr.io/nicolasdemol/user:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: belovr-common-config
            - configMapRef:
                name: user-config
            - secretRef:
                name: user-secrets
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
