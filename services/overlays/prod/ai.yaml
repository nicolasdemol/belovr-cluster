apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/instance: ai
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
    belovr.io/environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
      app.kubernetes.io/instance: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
        app.kubernetes.io/instance: ai
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: belovr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ai
          image: ghcr.io/nicolasdemol/ai:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ai-config
            - secretRef:
                name: belovr-r2-secrets
            - secretRef:
                name: ai-secrets
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
