apiVersion: apps/v1
kind: Deployment
metadata:
  name: content
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/name: content
    app.kubernetes.io/instance: content
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: belovr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: content
      app.kubernetes.io/instance: content
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content
        app.kubernetes.io/instance: content
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: belovr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: content
          image: ghcr.io/nicolasdemol/content:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4100
              protocol: TCP
