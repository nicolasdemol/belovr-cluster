apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
spec:
  source:
    helm:
      valuesObject:
        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: rabbitmq.lab.belovr.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - rabbitmq.lab.belovr.com
              secretName: belovr-app-tls-secret
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
