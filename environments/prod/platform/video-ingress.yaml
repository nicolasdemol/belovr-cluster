apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: belovr-video-ingress
  namespace: belovr
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  labels:
    app.kubernetes.io/name: video
    app.kubernetes.io/part-of: belovr-platform
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - video.belovr.com
      secretName: belovr-app-tls-secret
  rules:
    - host: video.belovr.com
      http:
        paths:
          - path: /internal/transcoding
            pathType: Prefix
            backend:
              service:
                name: video
                port:
                  number: 4700
