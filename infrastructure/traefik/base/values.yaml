# Shared Traefik configuration for dev and prod-like clusters.
deployment:
  kind: DaemonSet

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  # Do not keep compatibility providers inherited from the MicroK8s addon.
  kubernetesIngressNginx:
    enabled: false
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false

gatewayClass:
  enabled: false

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# Both environments use a single node and bind public ports directly.
ports:
  web:
    hostPort: 80
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    hostPort: 443

# A surge pod cannot bind the same host ports on a single node.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Public traffic reaches the DaemonSet through hostPort; no external
# LoadBalancer implementation is available on these single-node VPS clusters.
service:
  type: ClusterIP

# Explicitly clear IngressClasses and other objects inherited from the addon.
extraObjects: []
