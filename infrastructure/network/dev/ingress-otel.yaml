apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-gateway-ingress
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: observability-otel-upload-10m@kubernetescrd
  labels:
    app.kubernetes.io/part-of: belovr-platform
spec:
  ingressClassName: traefik
  rules:
    - host: otel.lab.belovr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-collector-gateway
                port:
                  number: 4318
  tls:
    - hosts:
        - otel.lab.belovr.com
      secretName: lab-tls-secret
